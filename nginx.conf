# cat /etc/nginx/nginx.conf
user www-data;
worker_processes auto;

pid /var/run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;
load_module /usr/lib/nginx/modules/ngx_stream_module.so;

events {
    use epoll;
    worker_connections 1024;
    multi_accept on;
}

stream {
    map $ssl_preread_server_name $sni_map {
        __SITE_CDN_DOMAIN__ web;
        #__SITE_HEADSCALE_DOMAIN__ headscale;
        default xray;
    }

    upstream web {
        server 127.0.0.1:9443;
    }

    ## headscale
    #upstream headscale {
    #    server 127.0.0.1:9444;
    #}

    upstream xray {
        server 127.0.0.1:9000;
    }

    server {
        listen 443 so_keepalive=on;
        listen 8443 so_keepalive=on;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $sni_map;
    }
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    log_format  main  '$remote_addr|$http_x_forwarded_for|$proxy_add_x_forwarded_for|$proxy_protocol_addr - $remote_user [$time_local] "$proxy_host" "$host" "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # map for delegating external sites
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }
    map $remote_addr $proxy_forwarded_elem {
        ~^[0-9.]+$        "for=$remote_addr";
        ~^[0-9A-Fa-f:.]+$ "for=\"[$remote_addr]\"";
        default           "for=unknown";
    }
    map $http_forwarded $proxy_add_forwarded {
        "~^(,[ \\t]*)*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*([ \\t]*,([ \\t]*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*)?)*$" "$http_forwarded, $proxy_forwarded_elem";
        default "$proxy_forwarded_elem";
    }

    server {
        listen 80;
        listen [::]:80;
        return 301 https://$host$request_uri;
    }

    server {
        listen                     9443 ssl proxy_protocol;
        listen                     [::]:9443 ssl proxy_protocol;

        server_name                __SITE_DOMAIN__ __SITE_CDN_DOMAIN__;

        set_real_ip_from           127.0.0.1;
        real_ip_header             proxy_protocol;

        ssl_certificate            /etc/ssl/private/__DOMAIN__/fullchain.pem;
        ssl_certificate_key        /etc/ssl/private/__DOMAIN__/privkey.pem;

        ssl_protocols              TLSv1.2 TLSv1.3;
        ssl_ciphers                TLS13_AES_128_GCM_SHA256:TLS13_AES_256_GCM_SHA384:TLS13_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers  on;

        ssl_session_timeout        1h;
        ssl_session_cache          shared:SSL:10m;

        ssl_stapling               on;
        ssl_stapling_verify        on;
        resolver                   1.1.1.1 valid=60s;
        resolver_timeout           2s;

        # xhttp
        location /api/v1/stream {
            client_max_body_size         0;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Real-IP    $remote_addr;
            grpc_set_header Host	     $host;
            grpc_read_timeout            5m;
            grpc_send_timeout            5m;
            grpc_socket_keepalive        on;
            grpc_pass                    127.0.0.1:9001;
        }


        # root. delegating external sites
        location / {
            sub_filter                            $proxy_host $host;
            sub_filter_once                       off;

            set $website                          developer.mozilla.org;
            proxy_pass                            https://$website;
            resolver                              1.1.1.1;

            proxy_set_header Host                 $proxy_host;

            proxy_http_version                    1.1;
            proxy_cache_bypass                    $http_upgrade;

            proxy_ssl_server_name                 on;

            proxy_set_header Upgrade              $http_upgrade;
            proxy_set_header Connection           $connection_upgrade;
            proxy_set_header X-Real-IP            $remote_addr;
            proxy_set_header Forwarded            $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto    $scheme;
            proxy_set_header X-Forwarded-Host     $host;
            proxy_set_header X-Forwarded-Port     $server_port;

            proxy_connect_timeout                 60s;
            proxy_send_timeout                    60s;
            proxy_read_timeout                    60s;
        }
    }

